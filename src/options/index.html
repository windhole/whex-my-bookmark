<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Bookmark</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>My Bookmark</h1>
      <p class="lead">
        The toolbar button saves the current page to <code>inbox</code> (local storage).
        Import a Markdown library for the browse menu. Export merges <code>inbox</code>
        under <code># inbox</code> with that library.
      </p>
      <div class="row">
        <label class="file">
          Import
          <input id="import" type="file" accept=".md,text/markdown,text/plain" />
        </label>
        <button type="button" id="export" class="primary">Export</button>
        <span id="status" role="status"></span>
      </div>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
